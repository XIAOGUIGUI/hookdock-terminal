name: Release HookDock Terminal

on:
  push:
    tags: ["hookdock-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare version and signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.HOOKDOCK_TERMINAL_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw "HOOKDOCK_TERMINAL_CERTIFICATE_BASE64 is not configured"
          }
          $version = "${{ github.ref_name }}" -replace '^hookdock-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tags must use hookdock-vA.B.C.D"
          }
          [xml]$manifest = Get-Content src\cascadia\CascadiaPackage\Package-Dev.appxmanifest
          $manifest.Package.Identity.Version = $version
          $manifest.Save((Resolve-Path src\cascadia\CascadiaPackage\Package-Dev.appxmanifest))
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD 'src\cascadia\CascadiaPackage\CascadiaPackage_TemporaryKey.pfx'),
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build signed x64 MSIX
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.HOOKDOCK_TERMINAL_CERTIFICATE_PASSWORD }}
        run: |
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTerminalBranding=Dev `
            /p:AppxSymbolPackageEnabled=false `
            "/p:PackageCertificatePassword=$env:CERTIFICATE_PASSWORD" `
            '/t:Terminal\CascadiaPackage' `
            /m

      - name: Stage App Installer assets
        shell: pwsh
        run: |
          $assetDirectory = New-Item -ItemType Directory -Force release-assets
          $source = Get-ChildItem src\cascadia\CascadiaPackage\AppPackages -Recurse -Filter *.msix |
            Where-Object { $_.Name -notmatch 'symbols' } |
            Select-Object -First 1
          if (-not $source) { throw "No MSIX was produced" }
          $msixName = "HookDockTerminal_$env:VERSION`_x64.msix"
          Copy-Item $source.FullName (Join-Path $assetDirectory $msixName)

          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $appInstallerName = "HookDockTerminal.appinstaller"
          $content = Get-Content packaging\HookDockTerminal.appinstaller.in -Raw
          $content = $content.Replace('@VERSION@', $env:VERSION)
          $content = $content.Replace('@MSIX_URI@', "$base/$msixName")
          $content = $content.Replace('@APPINSTALLER_URI@', "$base/$appInstallerName")
          Set-Content -Path (Join-Path $assetDirectory $appInstallerName) -Value $content -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -File | Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" @assets `
            --title "HookDock Terminal $env:VERSION" `
            --generate-notes
