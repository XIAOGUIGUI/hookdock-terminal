name: Release HookDock Terminal

on:
  push:
    tags: ["hookdock-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare version and Windows 11 unsigned identity
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^hookdock-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tags must use hookdock-vA.B.C.D"
          }
          .\.hookdock\prepare-unsigned-package.ps1 -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build unsigned x64 MSIX
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTerminalBranding=Dev `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxSymbolPackageEnabled=false `
            '/t:Terminal\CascadiaPackage' `
            /m

      - name: Stage unsigned package
        shell: pwsh
        run: |
          $assetDirectory = New-Item -ItemType Directory -Force release-assets
          $source = Get-ChildItem src\cascadia\CascadiaPackage\AppPackages -Recurse -Filter *.msix |
            Where-Object { $_.Name -notmatch 'symbols' } |
            Select-Object -First 1
          if (-not $source) { throw "No MSIX was produced" }

          $msixName = "HookDockTerminal_$env:VERSION`_x64_unsigned.msix"
          $destination = Join-Path $assetDirectory $msixName
          Copy-Item $source.FullName $destination
          $checksum = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $msixName" |
            Set-Content -Path (Join-Path $assetDirectory "checksums.txt") -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -File | Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" @assets `
            --title "HookDock Terminal $env:VERSION" `
            --notes "Unsigned Windows 11 test package. Install from elevated PowerShell with Add-AppxPackage -AllowUnsigned."
